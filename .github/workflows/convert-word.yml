name: Markdown to Word Conversion

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      markdown_file:
        description: 'Path to the markdown file to convert'
        required: false
        default: 'docs/sample.md'
      output_name:
        description: 'Base name for the output file and release tag'
        required: false
        default: 'markdown-to-word'

jobs:
  markdown-to-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Extract filename from input
        id: filename
        run: |
          if [ -n "${{ inputs.markdown_file }}" ]; then
            BASENAME=$(basename -a "${{ inputs.markdown_file }}" | sed 's/\.md$//')
          else
            BASENAME="combined"
          fi
          echo "BASENAME=$BASENAME" >> $GITHUB_OUTPUT

      - name: Combine All Markdown Files
        if: inputs.markdown_file == ''
        run: |
          cat <<EOF > "$RUNNER_TEMP/combined.md"
          ---
          title: "GCCO"
          subtitle: "Markdown to Word"
          date: "$(date +%Y-%m-%d)"
          version: "v0.0.1"
          ---

          \newpage

          ::: {#toc}
          :::

          \newpage
          EOF
          find docs -name "*.md" -not -name "combined.md" -exec sh -c 'cat "$@"; echo' _ {} + >> "$RUNNER_TEMP/combined.md"
          sed -E -i 's|(\.\./)+attachments|attachments|g' "$RUNNER_TEMP/combined.md"

      - name: Use single markdown file
        if: inputs.markdown_file != ''
        run: cp "${{ inputs.markdown_file }}" "$RUNNER_TEMP/input.md"

      - name: Convert Markdown to Word
        uses: gccloudone/markdown-to-word@main
        with:
          default_title: "${{ inputs.output_name }}"
          markdown_file: "${{ inputs.markdown_file != '' && inputs.markdown_file || format('{0}/combined.md', runner.temp) }}"
          output_file: "output/${{ inputs.output_name || 'markdown-to-word' }}-${{ steps.timestamp.outputs.TIMESTAMP }}.docx"
          reference_doc: "template/ssc-template-v2.7.dotx"

      - name: Upload Word Document
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_name || 'markdown-to-word' }}-${{ steps.timestamp.outputs.TIMESTAMP }}
          path: output/${{ inputs.output_name || 'markdown-to-word' }}-${{ steps.timestamp.outputs.TIMESTAMP }}.docx
          archive: false

      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.output_name || 'docs' }}-${{ steps.filename.outputs.BASENAME }}-${{ steps.timestamp.outputs.TIMESTAMP }}
          release_name: Documentation release for ${{ inputs.output_name || steps.filename.outputs.BASENAME }}
          body: |
            Hello! This release contains a PDF and DOCX export generated from ${{ inputs.markdown_file || 'combined markdown files' }}.
            
            You can download the files from the release assets below.
          draft: false
          prerelease: false
          commitish: ${{ github.sha }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: output/${{ inputs.output_name || 'markdown-to-word' }}-${{ steps.timestamp.outputs.TIMESTAMP }}.docx
          asset_name: ${{ inputs.output_name || 'markdown-to-word' }}-${{ steps.timestamp.outputs.TIMESTAMP }}.docx
          asset_content_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
