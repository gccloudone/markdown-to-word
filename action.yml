name: "Markdown to Word Converter"
description: "Converts a Markdown file to a Word document using md2docx-python library with custom header formatting."
author: "gccloudone"

inputs:
  default_title:
    description: "Default title for the Word document."
    required: true
  markdown_file:
    description: "Path to the Markdown file to be converted."
    required: true
  output_file:
    description: "Path to the output DOCX file."
    required: false
    default: "output/output.docx"
  classification:
    description: "Classification text for header (e.g., UNCLASSIFIED)."
    required: false
    default: "UNCLASSIFIED"

runs:
  using: "composite"
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Convert Markdown to DOCX
      shell: bash
      run: |
        # Install dependencies to user site-packages
        python3 -m pip install --user -r "${{ github.action_path }}/requirements.txt"
        
        # Add user site-packages to PYTHONPATH
        PYTHON_USER_SITE=$(python3 -c "import site; print(site.getusersitepackages())")
        export PYTHONPATH="$PYTHON_USER_SITE:$PYTHONPATH"
        
        # Extract title from metadata
        TITLE="${{ inputs.default_title }}"
        python3 "${{ github.action_path }}/scripts/extract_metadata.py" "${{ inputs.markdown_file }}" > /tmp/metadata.txt 2>&1 || true
        if [ -f /tmp/metadata.txt ]; then
          while IFS= read -r line; do
            if [[ "$line" == Metadata* ]]; then
              continue
            fi
            if [[ "$line" == *:* ]]; then
              key=$(echo "$line" | cut -d: -f1 | xargs)
              value=$(echo "$line" | cut -d: -f2- | xargs)
              if [ "$key" = "title" ] && [ -z "$TITLE" ]; then
                TITLE="$value"
              fi
            fi
          done < /tmp/metadata.txt
        fi
        
        # Convert to DOCX
        python3 "${{ github.action_path }}/scripts/convert_with_md2docx.py" \
          "${{ inputs.markdown_file }}" \
          "${{ inputs.output_file }}" \
          "$TITLE" \
          "${{ inputs.classification }}"
        
        echo "title=$TITLE" >> $GITHUB_OUTPUT
